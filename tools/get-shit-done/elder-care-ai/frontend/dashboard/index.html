<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Caregiver Dashboard - Monitor elderly medication adherence in real-time">
  <title>🏥 Caregiver Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg-primary: #0a0a14;
      --bg-secondary: #111827;
      --bg-card: #1f2937;
      --bg-elevated: #2a3346;
      --text-primary: #f1f5f9;
      --text-secondary: #94a3b8;
      --text-dim: #64748b;
      --accent-indigo: #818cf8;
      --accent-green: #34d399;
      --accent-amber: #fbbf24;
      --accent-red: #f87171;
      --border: rgba(148, 163, 184, 0.08);
      --border-hover: rgba(148, 163, 184, 0.15);
    }

    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100dvh;
      padding: 0;
    }

    /* ─── Header ────────────────────────────────── */
    .header {
      background: var(--bg-secondary);
      border-bottom: 1px solid var(--border);
      padding: 20px 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 10;
      backdrop-filter: blur(12px);
    }

    .header h1 {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -0.5px;
    }

    .header h1 span { color: var(--accent-indigo); }

    .header-controls {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .header-controls label {
      color: var(--text-secondary);
      font-size: 14px;
    }

    .header-controls input, .header-controls select {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text-primary);
      padding: 8px 12px;
      font-family: 'Inter', sans-serif;
      font-size: 14px;
    }

    .header-controls input:focus, .header-controls select:focus {
      outline: none;
      border-color: var(--accent-indigo);
    }

    .btn-refresh {
      background: linear-gradient(135deg, var(--accent-indigo), #6366f1);
      color: white;
      border: none;
      border-radius: 8px;
      padding: 8px 16px;
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-refresh:hover { transform: translateY(-1px); box-shadow: 0 4px 16px rgba(99,102,241,0.3); }

    /* ─── Stats Bar ─────────────────────────────── */
    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 16px;
      padding: 24px 32px;
    }

    .stat-card {
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px;
      text-align: center;
      transition: all 0.3s ease;
    }

    .stat-card:hover {
      border-color: var(--border-hover);
      transform: translateY(-2px);
    }

    .stat-value {
      font-size: 36px;
      font-weight: 800;
      letter-spacing: -1px;
      margin-bottom: 4px;
    }

    .stat-label {
      font-size: 13px;
      color: var(--text-secondary);
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .stat-card.green .stat-value { color: var(--accent-green); }
    .stat-card.amber .stat-value { color: var(--accent-amber); }
    .stat-card.red .stat-value { color: var(--accent-red); }
    .stat-card.indigo .stat-value { color: var(--accent-indigo); }

    /* ─── Table ──────────────────────────────────── */
    .table-container {
      padding: 0 32px 32px;
    }

    .table-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .table-header h2 {
      font-size: 18px;
      font-weight: 700;
    }

    .table-wrapper {
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    thead th {
      background: var(--bg-card);
      padding: 14px 20px;
      text-align: left;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.8px;
      border-bottom: 1px solid var(--border);
    }

    tbody td {
      padding: 16px 20px;
      font-size: 15px;
      border-bottom: 1px solid var(--border);
      transition: background 0.2s;
    }

    tbody tr:hover td { background: rgba(99, 102, 241, 0.03); }
    tbody tr:last-child td { border-bottom: none; }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 14px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 600;
    }

    .status-pill.taken {
      background: rgba(52, 211, 153, 0.12);
      color: var(--accent-green);
    }

    .status-pill.pending {
      background: rgba(251, 191, 36, 0.12);
      color: var(--accent-amber);
    }

    .status-pill.missed {
      background: rgba(248, 113, 113, 0.12);
      color: var(--accent-red);
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      display: inline-block;
    }

    .status-dot.taken { background: var(--accent-green); }
    .status-dot.pending { background: var(--accent-amber); animation: pulse 2s infinite; }
    .status-dot.missed { background: var(--accent-red); }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-secondary);
    }

    .empty-state .emoji { font-size: 48px; margin-bottom: 12px; }

    /* ─── Live indicator ─────────────────────────── */
    .live-dot {
      width: 8px;
      height: 8px;
      background: var(--accent-green);
      border-radius: 50%;
      display: inline-block;
      margin-right: 6px;
      animation: pulse 1.5s infinite;
    }

    .live-text {
      font-size: 12px;
      color: var(--text-dim);
    }
  </style>
</head>
<body>

  <header class="header">
    <h1>🏥 <span>Caregiver</span> Dashboard</h1>
    <div class="header-controls">
      <label>Elderly User ID:</label>
      <input type="number" id="elderlyId" value="1" min="1" style="width: 60px;">
      <label>Date:</label>
      <input type="date" id="dateFilter">
      <button class="btn-refresh" onclick="loadDashboard()">Refresh</button>
      <span class="live-text"><span class="live-dot"></span>Auto-refreshing</span>
    </div>
  </header>

  <div class="stats" id="stats">
    <div class="stat-card indigo">
      <div class="stat-value" id="stat-total">—</div>
      <div class="stat-label">Total</div>
    </div>
    <div class="stat-card green">
      <div class="stat-value" id="stat-taken">—</div>
      <div class="stat-label">Taken</div>
    </div>
    <div class="stat-card amber">
      <div class="stat-value" id="stat-pending">—</div>
      <div class="stat-label">Pending</div>
    </div>
    <div class="stat-card red">
      <div class="stat-value" id="stat-missed">—</div>
      <div class="stat-label">Missed</div>
    </div>
  </div>

  <div class="table-container">
    <div class="table-header">
      <h2>Medication Log</h2>
    </div>
    <div class="table-wrapper">
      <table>
        <thead>
          <tr>
            <th>Time</th>
            <th>Medicine</th>
            <th>Status</th>
            <th>Taken At</th>
          </tr>
        </thead>
        <tbody id="log-table">
          <tr>
            <td colspan="4" class="empty-state">
              <div class="emoji">📋</div>
              <div>Loading...</div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <script>
    const API_BASE = 'http://localhost:3000';

    // Set default date to today
    document.getElementById('dateFilter').value = new Date().toISOString().split('T')[0];

    async function loadDashboard() {
      const elderlyId = document.getElementById('elderlyId').value;
      const date = document.getElementById('dateFilter').value;
      const tbody = document.getElementById('log-table');

      try {
        const res = await fetch(`${API_BASE}/logs?user_id=${elderlyId}&date=${date}`);
        const logs = await res.json();

        // Update stats
        const taken = logs.filter(l => l.status === 'taken').length;
        const pending = logs.filter(l => l.status === 'pending').length;
        const missed = logs.filter(l => l.status === 'missed').length;

        document.getElementById('stat-total').textContent = logs.length;
        document.getElementById('stat-taken').textContent = taken;
        document.getElementById('stat-pending').textContent = pending;
        document.getElementById('stat-missed').textContent = missed;

        if (logs.length === 0) {
          tbody.innerHTML = `
            <tr>
              <td colspan="4" class="empty-state">
                <div class="emoji">📭</div>
                <div>No medication logs found for this date.</div>
              </td>
            </tr>
          `;
          return;
        }

        tbody.innerHTML = logs.map(log => {
          const statusIcon = log.status === 'taken' ? '✅' : log.status === 'missed' ? '❌' : '⏳';
          const takenTime = log.taken_at ? new Date(log.taken_at).toLocaleTimeString() : '—';
          return `
            <tr>
              <td style="font-weight: 600;">${log.time}</td>
              <td>${log.name}</td>
              <td>
                <span class="status-pill ${log.status}">
                  <span class="status-dot ${log.status}"></span>
                  ${statusIcon} ${log.status.charAt(0).toUpperCase() + log.status.slice(1)}
                </span>
              </td>
              <td style="color: var(--text-secondary);">${takenTime}</td>
            </tr>
          `;
        }).join('');

      } catch (err) {
        tbody.innerHTML = `
          <tr>
            <td colspan="4" class="empty-state">
              <div class="emoji">⚠️</div>
              <div>Could not connect to the server.</div>
            </td>
          </tr>
        `;
      }
    }

    // Auto-refresh every 30 seconds
    setInterval(loadDashboard, 30000);

    // Initial load
    loadDashboard();
  </script>
</body>
</html>
